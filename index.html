<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>모먼핀</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Outfit:wght@400;500;600;700&display=swap');
  :root{
    --bg:#fafafa;
    --card:#ffffff;
    --ink:#16161a;
    --muted:#9b9ba3;
    --line:#efeff2;
    --brand:#ff4d5e;
    --brand2:#ff7a45;
    --teal:#13bca4;
    --blue:#5b8def;
    --shadow:0 4px 24px rgba(20,20,30,.07);
    --shadow2:0 12px 40px rgba(20,20,30,.12);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{
    font-family:'Outfit','Gowun Dodum',-apple-system,BlinkMacSystemFont,sans-serif;
    background:var(--bg);color:var(--ink);line-height:1.45;
    -webkit-font-smoothing:antialiased;overscroll-behavior-y:contain;
  }
  #app{max-width:480px;margin:0 auto;min-height:100vh;background:var(--bg);position:relative;padding-bottom:90px}

  /* ---- top bar ---- */
  .top{position:sticky;top:0;z-index:40;background:rgba(250,250,250,.85);backdrop-filter:blur(14px);
    padding:14px 18px 10px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line)}
  .logo{display:flex;align-items:center;gap:8px}
  .logo .dot{width:24px;height:24px;border-radius:8px 8px 8px 3px;background:linear-gradient(135deg,var(--brand2),var(--brand));
    box-shadow:0 4px 12px rgba(255,77,94,.35);position:relative}
  .logo .dot::after{content:"";position:absolute;width:7px;height:7px;border-radius:50%;background:#fff;left:8.5px;top:7px}
  .logo h1{font-size:19px;margin:0;font-weight:700;letter-spacing:-.5px}
  .top .grp{font-size:12px;font-weight:600;color:var(--muted);display:flex;align-items:center;gap:6px;
    background:#fff;border:1px solid var(--line);padding:6px 12px;border-radius:20px}
  .top .grp .av{display:flex}
  .top .grp .av span{width:18px;height:18px;border-radius:50%;border:2px solid #fff;margin-left:-7px;font-size:9px;
    color:#fff;display:flex;align-items:center;justify-content:center;font-weight:600}
  .top .grp .av span:first-child{margin-left:0}

  /* ---- moment banner ---- */
  .banner{margin:12px 14px;border-radius:22px;overflow:hidden;position:relative;
    background:linear-gradient(120deg,#16161a,#2a2030);box-shadow:var(--shadow2);color:#fff}
  .banner.live{background:linear-gradient(120deg,var(--brand),var(--brand2))}
  .banner .inner{padding:18px 20px;position:relative;z-index:2}
  .banner .tag{font-size:11px;font-weight:600;letter-spacing:1.5px;text-transform:uppercase;opacity:.85}
  .banner .big{font-size:26px;font-weight:700;letter-spacing:-.5px;margin:3px 0 2px;font-variant-numeric:tabular-nums}
  .banner .small{font-size:13px;opacity:.8}
  .banner .glow{position:absolute;width:160px;height:160px;border-radius:50%;background:rgba(255,255,255,.12);
    right:-40px;top:-40px;filter:blur(10px)}
  .banner .cta{position:absolute;right:18px;bottom:18px;z-index:3;background:#fff;color:var(--brand);
    border:none;font-family:inherit;font-weight:700;font-size:13px;padding:11px 18px;border-radius:30px;cursor:pointer;
    box-shadow:0 6px 18px rgba(0,0,0,.18);display:none;align-items:center;gap:6px}
  .banner.live .cta{display:inline-flex;animation:pop .5s ease}
  @keyframes pop{from{transform:scale(.8);opacity:0}to{transform:scale(1);opacity:1}}
  .banner.live .big{animation:beat 1s ease-in-out infinite}
  @keyframes beat{0%,100%{transform:scale(1)}50%{transform:scale(1.03)}}

  /* ---- story row ---- */
  .stories{display:flex;gap:14px;padding:6px 18px 4px;overflow-x:auto;scrollbar-width:none}
  .stories::-webkit-scrollbar{display:none}
  .story{flex:none;text-align:center;width:62px;cursor:pointer}
  .story .ring{width:58px;height:58px;border-radius:50%;padding:2.5px;background:linear-gradient(135deg,var(--brand),var(--brand2));margin:0 auto}
  .story.done .ring{background:linear-gradient(135deg,var(--teal),var(--blue))}
  .story.waiting .ring{background:var(--line)}
  .story .face{width:100%;height:100%;border-radius:50%;border:2.5px solid #fff;display:flex;align-items:center;justify-content:center;
    font-size:22px;color:#fff;font-weight:600;overflow:hidden}
  .story .nm{font-size:11px;color:var(--muted);margin-top:5px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .story.you .face{background:#f0f0f3;color:var(--brand);font-size:24px}

  /* ---- feed ---- */
  /* view toggle */
  .vtoggle{display:flex;gap:6px;margin:4px 18px 2px;background:#f0f0f3;border-radius:24px;padding:4px}
  .vtoggle button{flex:1;border:none;background:none;font-family:inherit;font-size:13px;font-weight:600;color:var(--muted);
    padding:8px;border-radius:20px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:5px;transition:.15s}
  .vtoggle button.on{background:#fff;color:var(--ink);box-shadow:0 2px 8px rgba(0,0,0,.08)}

  /* grid view */
  .grid{padding:8px 14px 4px;display:grid;gap:8px}
  .grid.n1{grid-template-columns:1fr}
  .grid.n2{grid-template-columns:1fr 1fr}
  .grid.n3,.grid.n4{grid-template-columns:1fr 1fr}
  .grid.n5,.grid.n6{grid-template-columns:1fr 1fr 1fr}
  .gcell{position:relative;aspect-ratio:3/4;border-radius:16px;overflow:hidden;cursor:pointer;box-shadow:var(--shadow);
    display:flex;align-items:center;justify-content:center;font-size:54px}
  .grid.n1 .gcell{font-size:90px}
  .grid.n3 .gcell,.grid.n5 .gcell,.grid.n6 .gcell{font-size:40px}
  .gcell .gpip{position:absolute;top:7px;left:7px;width:34px;aspect-ratio:1;border-radius:9px;border:2px solid #fff;
    display:flex;align-items:center;justify-content:center;font-size:17px}
  .gcell .gname{position:absolute;left:7px;bottom:7px;right:7px;display:flex;align-items:center;gap:5px}
  .gcell .gname .nb{font-size:11px;font-weight:700;color:#fff;text-shadow:0 1px 4px rgba(0,0,0,.6);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .gcell .gloc{position:absolute;top:7px;right:7px;background:rgba(0,0,0,.45);backdrop-filter:blur(6px);color:#fff;
    font-size:9px;font-weight:600;padding:3px 7px;border-radius:14px;max-width:62%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .gcell .glate{position:absolute;top:7px;right:7px;background:#e08a1e;color:#fff;font-size:9px;font-weight:700;padding:3px 7px;border-radius:14px}
  .gcell.wait{background:#f0f0f3;border:1.5px dashed #d8d8de;font-size:28px;color:#c4c4cc}
  .gcell.wait .gname .nb{color:var(--muted);text-shadow:none}
  .gcell .gtime{position:absolute;right:7px;bottom:7px;background:rgba(0,0,0,.45);backdrop-filter:blur(6px);color:#fff;
    font-size:10px;font-weight:600;padding:3px 7px;border-radius:14px}
  .feed{padding:8px 14px 4px;display:flex;flex-direction:column;gap:18px}
  .post{background:var(--card);border-radius:24px;overflow:hidden;box-shadow:var(--shadow)}
  .post .head{display:flex;align-items:center;gap:10px;padding:12px 14px 10px}
  .post .head .av{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;
    color:#fff;font-weight:600;font-size:15px;flex:none}
  .post .head .nm{font-weight:600;font-size:14.5px;line-height:1.1}
  .post .head .sub{font-size:12px;color:var(--muted)}
  .post .head .when{margin-left:auto;font-size:12px;color:var(--muted)}
  .post .head .late{margin-left:auto;font-size:11px;font-weight:600;color:#e08a1e;background:#fff4e2;padding:4px 9px;border-radius:20px}

  .photo{position:relative;aspect-ratio:4/5;overflow:hidden}
  .photo .main{width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-size:120px}
  /* BeReal-style PIP selfie */
  .photo .pip{position:absolute;top:12px;left:12px;width:84px;aspect-ratio:3/4;border-radius:14px;border:2.5px solid #fff;
    overflow:hidden;display:flex;align-items:center;justify-content:center;font-size:38px;cursor:pointer;z-index:3}
  .photo .pip img,.photo .main img{width:100%;height:100%;object-fit:cover}
  .photo .main img{display:block}
  .photo .locpin{position:absolute;left:12px;bottom:12px;display:flex;align-items:center;gap:6px;
    background:rgba(0,0,0,.42);backdrop-filter:blur(8px);color:#fff;font-size:12.5px;font-weight:500;
    padding:7px 12px 7px 9px;border-radius:30px}
  .photo .locpin .ic{width:18px;height:18px;border-radius:50%;background:var(--brand);display:flex;align-items:center;justify-content:center;font-size:10px;flex:none}
  .photo .timepin{position:absolute;right:12px;bottom:12px;background:rgba(0,0,0,.42);backdrop-filter:blur(8px);
    color:#fff;font-size:12.5px;font-weight:600;padding:7px 12px;border-radius:30px;font-variant-numeric:tabular-nums}

  .post .foot{padding:11px 14px 14px;display:flex;align-items:center;gap:18px}
  .post .foot button{background:none;border:none;font-family:inherit;color:var(--muted);font-size:13px;font-weight:500;
    display:flex;align-items:center;gap:5px;cursor:pointer;padding:0}
  .post .foot .react{font-size:19px}
  .post .foot .mapbtn{margin-left:auto;color:var(--teal);font-weight:600;border:1px solid #d7f3ee;background:#effbf9;
    padding:7px 13px;border-radius:30px}

  .empty{text-align:center;color:var(--muted);padding:48px 24px;font-size:14px}
  .empty .big{font-size:40px;display:block;margin-bottom:10px}

  /* ---- map view ---- */
  .mhead{padding:16px 18px 6px}
  .mhead h2{font-size:20px;margin:0;font-weight:700;letter-spacing:-.4px}
  .mhead p{font-size:13px;color:var(--muted);margin:2px 0 0}
  .mapwrap{margin:6px 14px}
  .mapwrap.big{margin:8px 14px 0}
  .mapbox{position:relative;height:300px;border-radius:24px;overflow:hidden;box-shadow:var(--shadow);
    background:
      repeating-linear-gradient(0deg,transparent 0 32px,rgba(0,0,0,.025) 32px 33px),
      repeating-linear-gradient(90deg,transparent 0 32px,rgba(0,0,0,.025) 32px 33px),
      linear-gradient(135deg,#eef6f4,#f4f0ea)}
  .mapbox.tall{height:42vh;min-height:320px;max-height:440px}
  .mapbox .road{position:absolute;background:#fff;opacity:.9}
  .mapbox .r1{left:0;top:42%;width:100%;height:14px;transform:rotate(-4deg)}
  .mapbox .r2{left:38%;top:0;width:12px;height:100%}
  .mapbox .water{position:absolute;left:-5%;bottom:8%;width:120%;height:40px;background:rgba(91,141,239,.18);transform:rotate(-6deg);border-radius:30px}
  /* 내 위치 점 */
  .mepin{position:absolute;left:50%;top:50%;width:16px;height:16px;border-radius:50%;background:var(--blue);
    border:3px solid #fff;box-shadow:0 0 0 6px rgba(91,141,239,.22),0 4px 10px rgba(0,0,0,.2);transform:translate(-50%,-50%);z-index:2}
  .mepin::after{content:"나";position:absolute;left:50%;top:-22px;transform:translateX(-50%);font-size:10px;font-weight:700;color:var(--blue);background:#fff;padding:1px 6px;border-radius:10px;box-shadow:0 2px 6px rgba(0,0,0,.12)}
  /* 사진 핀 */
  .mpin{position:absolute;transform:translate(-50%,-100%);text-align:center;cursor:pointer;transition:transform .15s;z-index:3}
  .mpin:active{transform:translate(-50%,-100%) scale(.92)}
  .mpin .ph{width:52px;height:52px;border-radius:50% 50% 50% 4px;border:3px solid #fff;box-shadow:0 6px 16px rgba(0,0,0,.25);
    display:flex;align-items:center;justify-content:center;font-size:24px;background:#222;overflow:hidden;transform:rotate(-45deg)}
  .mpin .ph>*{transform:rotate(45deg)}
  .mpin .ph img{width:130%;height:130%;object-fit:cover;transform:rotate(45deg)}
  .mpin .nm{font-size:10px;font-weight:700;background:#fff;padding:2px 8px;border-radius:12px;box-shadow:0 2px 8px rgba(0,0,0,.15);margin-top:5px;display:inline-block}
  .mpin .nm .d{color:var(--teal)}
  .mpin.late .ph{border-color:#f0b15a}
  /* 지도 요약 바 */
  .mapsummary{display:flex;gap:10px;align-items:center;justify-content:center;flex-wrap:wrap;
    margin-top:10px;padding:11px 14px;background:#fff;border-radius:16px;box-shadow:var(--shadow);font-size:13px}
  .mapsummary b{font-weight:700}
  .mapsummary .chip{display:inline-flex;align-items:center;gap:5px;color:var(--ink)}
  .mapsummary .chip .k{color:var(--muted);font-weight:500}
  .mapsummary .sep{width:1px;height:14px;background:var(--line)}
  /* 핀 팝업 */
  .pinpop{position:fixed;inset:0;z-index:80;background:rgba(10,10,14,.72);display:none;align-items:center;justify-content:center;padding:24px}
  .pinpop.on{display:flex}
  .pincard{background:#fff;width:100%;max-width:340px;border-radius:24px;overflow:hidden;box-shadow:0 24px 60px rgba(0,0,0,.5);animation:pop .25s ease}
  .pincard .ph{position:relative;aspect-ratio:4/5;background:#222;display:flex;align-items:center;justify-content:center;font-size:120px}
  .pincard .ph img{width:100%;height:100%;object-fit:cover}
  .pincard .ph .pip{position:absolute;top:12px;left:12px;width:72px;aspect-ratio:3/4;border-radius:12px;border:2.5px solid #fff;
    overflow:hidden;display:flex;align-items:center;justify-content:center;font-size:30px;cursor:pointer}
  .pincard .ph .pip img{width:100%;height:100%;object-fit:cover}
  .pincard .ph .tt{position:absolute;right:12px;bottom:12px;background:rgba(0,0,0,.45);backdrop-filter:blur(8px);color:#fff;font-size:12px;font-weight:600;padding:6px 11px;border-radius:20px}
  .pincard .info{padding:14px 16px 16px;display:flex;align-items:center;gap:11px}
  .pincard .info .av{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;flex:none}
  .pincard .info .nm{font-weight:700;font-size:15px}
  .pincard .info .lc{font-size:12.5px;color:var(--muted)}
  .pincard .info .x{margin-left:auto;background:#f0f0f3;border:none;width:34px;height:34px;border-radius:50%;font-size:16px;cursor:pointer;color:var(--muted)}
  .maplist{padding:10px 18px 4px;display:flex;flex-direction:column;gap:2px}
  .maplist .li{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line)}
  .maplist .li:last-child{border-bottom:none}
  .maplist .li .av{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:600;flex:none}
  .maplist .li .nm{font-weight:600;font-size:14px}
  .maplist .li .lc{font-size:12.5px;color:var(--muted)}
  .maplist .li .tm{margin-left:auto;font-size:12px;color:var(--muted)}

  /* ---- settings ---- */
  .view{display:none}.view.on{display:block}
  .sec{padding:14px 18px}
  .sec h3{font-size:12px;color:var(--muted);letter-spacing:.4px;margin:0 0 10px;font-weight:600;text-transform:uppercase}
  .card2{background:#fff;border-radius:18px;padding:16px;box-shadow:var(--shadow);margin-bottom:12px}
  .card2 label{font-size:14.5px;font-weight:600;display:block;margin-bottom:10px}
  .pills{display:flex;gap:8px;flex-wrap:wrap}
  .pill{border:1.5px solid var(--line);background:#fff;color:var(--ink);padding:9px 15px;border-radius:24px;font-family:inherit;
    font-size:13px;font-weight:600;cursor:pointer;transition:.15s}
  .pill.on{background:var(--ink);color:#fff;border-color:var(--ink)}
  .input{width:100%;border:1.5px solid var(--line);background:#fff;border-radius:12px;padding:11px 13px;font-family:inherit;font-size:14px;color:var(--ink);font-weight:600}
  .hint{font-size:12px;color:var(--muted);margin-top:8px;line-height:1.4}
  .mem{display:flex;align-items:center;gap:11px;padding:9px 0}
  .mem .av{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:600;flex:none}
  .btn{width:100%;border:none;border-radius:14px;padding:15px;font-family:inherit;font-size:15px;font-weight:600;cursor:pointer;
    background:linear-gradient(135deg,var(--brand2),var(--brand));color:#fff;box-shadow:0 8px 20px rgba(255,77,94,.3)}
  .btn.ghost{background:#fff;color:var(--ink);border:1.5px solid var(--line);box-shadow:none}

  /* ---- nav ---- */
  .nav{position:fixed;left:50%;transform:translateX(-50%);bottom:14px;width:auto;
    background:var(--ink);border-radius:30px;display:flex;z-index:50;padding:6px;box-shadow:0 12px 30px rgba(0,0,0,.25);gap:2px}
  .nav button{background:none;border:none;font-family:inherit;color:rgba(255,255,255,.5);font-size:11px;font-weight:600;cursor:pointer;
    display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 20px;border-radius:24px;transition:.15s}
  .nav button .ic{font-size:19px;line-height:1}
  .nav button.on{color:#fff;background:rgba(255,255,255,.14)}

  /* ---- capture modal ---- */
  .modal{position:fixed;inset:0;z-index:90;background:rgba(10,10,14,.9);display:none;align-items:flex-end;justify-content:center}
  .modal.on{display:flex}
  .sheet{background:#000;width:100%;max-width:480px;border-radius:28px 28px 0 0;overflow:hidden;animation:up .3s ease}
  @keyframes up{from{transform:translateY(100%)}to{transform:translateY(0)}}
  .sheet .cam{aspect-ratio:4/5;background:linear-gradient(135deg,#2a2030,#16161a);position:relative;display:flex;align-items:center;justify-content:center;font-size:130px;overflow:hidden}
  .cam-vid{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
  #vFront{transform:scaleX(-1)} /* 셀카 미러 */
  .sheet .cam .pip{position:absolute;top:14px;left:14px;width:86px;aspect-ratio:3/4;border-radius:14px;border:2.5px solid #fff;
    display:flex;align-items:center;justify-content:center;font-size:40px;background:#333;overflow:hidden;cursor:pointer;z-index:5}
  .sheet .cam .pip video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
  .camhint{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);color:rgba(255,255,255,.85);font-size:13px;
    font-weight:500;text-align:center;background:rgba(0,0,0,.4);padding:10px 16px;border-radius:14px;z-index:4;max-width:80%}
  .sheet .cam .live{position:absolute;top:16px;right:16px;background:var(--brand);color:#fff;font-size:11px;font-weight:700;padding:5px 11px;border-radius:20px;letter-spacing:.5px}
  .sheet .cam .loc{position:absolute;left:14px;bottom:14px;background:rgba(0,0,0,.5);backdrop-filter:blur(8px);color:#fff;
    font-size:12.5px;font-weight:500;padding:7px 13px;border-radius:30px;display:flex;align-items:center;gap:6px}
  .sheet .bar{background:#000;padding:18px 20px 26px;text-align:center}
  .sheet .bar .q{color:rgba(255,255,255,.6);font-size:13px;margin-bottom:14px}
  .snap{width:78px;height:78px;border-radius:50%;border:5px solid #fff;background:transparent;cursor:pointer;position:relative}
  .snap::after{content:"";position:absolute;inset:5px;border-radius:50%;background:#fff;transition:.15s}
  .snap:active::after{inset:12px}
  .acts{display:flex;gap:10px;padding:0 20px 26px;background:#000}
  .acts button{flex:1;border:none;border-radius:14px;padding:14px;font-family:inherit;font-size:15px;font-weight:600;cursor:pointer}
  .acts .re{background:rgba(255,255,255,.12);color:#fff}
  .acts .go{background:#fff;color:#000}

  .toast{position:fixed;bottom:100px;left:50%;transform:translateX(-50%) translateY(16px);background:var(--ink);color:#fff;
    padding:12px 20px;border-radius:30px;font-size:13.5px;font-weight:600;z-index:100;opacity:0;transition:.3s;pointer-events:none;box-shadow:0 10px 30px rgba(0,0,0,.3)}
  .toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>
<div id="app">
  <div class="top">
    <div class="logo"><div class="dot"></div><h1>모먼핀</h1></div>
    <div class="grp"><div class="av" id="topAv"></div><span id="grpName">우리가족</span></div>
  </div>

  <!-- ===== HOME ===== -->
  <div class="view on" id="v-home">
    <div class="banner" id="banner">
      <div class="glow"></div>
      <div class="inner">
        <div class="tag" id="bTag">다음 모먼까지</div>
        <div class="big" id="bBig">--:--</div>
        <div class="small" id="bSmall">곧 다 같이 찍어요 📸</div>
      </div>
      <button class="cta" id="bCta">📸 지금 찍기</button>
    </div>

    <div class="vtoggle" id="vtoggle">
      <button class="on" data-v="map">📍 지도</button>
      <button data-v="grid">▦ 한눈에</button>
      <button data-v="feed">☰ 피드</button>
    </div>

    <!-- MAP as the main view -->
    <div id="paneMap">
      <div class="mapwrap big">

<script>
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const LS='momentpin_v2';
const SCENES={
  '🌆':'linear-gradient(135deg,#ff9a56,#ff5e7e)','🍜':'linear-gradient(135deg,#3a2718,#8a5a2b)',
  '☕':'linear-gradient(135deg,#4a3829,#9c7a52)','🏞️':'linear-gradient(135deg,#2d6a4f,#74c69d)',
  '🐟':'linear-gradient(135deg,#1a4a5a,#48a9c5)','🚶':'linear-gradient(135deg,#5a5a6e,#9ea0c0)',
  '📚':'linear-gradient(135deg,#3a3550,#7a6a9c)','🌃':'linear-gradient(135deg,#1a1a3a,#4a3a7a)',
  '🍰':'linear-gradient(135deg,#c97a8a,#f5c6d0)','🌳':'linear-gradient(135deg,#2d5a3d,#6ab07a)'};
const SELF=['😊','😎','🙂','😆','🥰','😄','🤓','😌'];

let st=load()||seed();
function seed(){
  const now=Date.now();
  const M=[
    {id:'me',name:'나',color:'#ff4d5e'},
    {id:'m2',name:'아빠',color:'#13bca4'},
    {id:'m3',name:'엄마',color:'#e0972e'},
    {id:'m4',name:'민지',color:'#5b8def'},
  ];
  const mk=(who,scene,self,loc,minsAgo,late)=>({id:'p'+Math.random().toString(36).slice(2),who,scene,self,loc,at:now-minsAgo*60000,late});
  return {
    grpName:'우리가족',mode:'fixed',
    fixedTimes:{'08:00':true,'12:30':false,'21:00':true},
    window:5,members:M,
    myPos:{lat:37.4979,lng:127.0276}, // 내 기준 위치(강남역 근처 가정)
    places:[ // 자주 가는 곳 — 좌표를 익숙한 이름으로
      {label:'우리집',lat:37.4955,lng:127.0301,r:300},
      {label:'회사',lat:37.5012,lng:127.0396,r:250},
      {label:'민지 학교',lat:37.4901,lng:127.0150,r:300},
    ],
    posts:[
      mk('m4','☕','😎',{name:'민지 학교 앞 카페',lat:37.4905,lng:127.0162,x:62,y:30},4,false),
      mk('m3','🍰','🥰',{name:'동네 베이커리',lat:37.4948,lng:127.0288,x:30,y:55},9,false),
      mk('m2','🐟','😄',{name:'양재천 산책로',lat:37.4823,lng:127.0405,x:48,y:72},12,true),
      mk('me','🌆','🙂',{name:'회사 옥상',lat:37.5012,lng:127.0396,x:72,y:22},6,false),
    ],
    activeMoment:null,
  };
}
function save(){localStorage.setItem(LS,JSON.stringify(st))}
function load(){try{return JSON.parse(localStorage.getItem(LS))}catch{return null}}

// nav
$$('.nav button').forEach(b=>b.onclick=()=>{
  $$('.nav button').forEach(x=>x.classList.remove('on'));b.classList.add('on');
  $$('.view').forEach(v=>v.classList.remove('on'));$('#v-'+b.dataset.view).classList.add('on');
  if(b.dataset.view==='map')renderMap();
});

// helpers
const pad=n=>String(n).padStart(2,'0');
const mColor=id=>{const m=st.members.find(x=>x.id===id);return m?m.color:'#888'};
const mName=id=>{const m=st.members.find(x=>x.id===id);return m?m.name:'?'};
const hhmm=ts=>{const d=new Date(ts);return d.getHours()+':'+pad(d.getMinutes())};
const ago=ts=>{const d=(Date.now()-ts)/1000;if(d<60)return '방금';if(d<3600)return Math.floor(d/60)+'분 전';return Math.floor(d/3600)+'시간 전'};

// 두 좌표 거리(km) — Haversine
function distKm(a,b){
  if(!a||!b||a.lat==null||b.lat==null)return null;
  const R=6371,r=Math.PI/180;
  const dLat=(b.lat-a.lat)*r,dLng=(b.lng-a.lng)*r;
  const s=Math.sin(dLat/2)**2+Math.cos(a.lat*r)*Math.cos(b.lat*r)*Math.sin(dLng/2)**2;
  return R*2*Math.atan2(Math.sqrt(s),Math.sqrt(1-s));
}
// 거리 표시 문자열
function distLabel(loc){
  if(loc&&loc.self)return '바로 여기';
  const d=distKm(st.myPos,loc);
  if(d==null)return '';
  if(d<0.05)return '바로 옆';
  if(d<1)return Math.round(d*1000)+'m';
  return d.toFixed(1)+'km';
}
// 좌표 → 자주 가는 곳 라벨 (반경 안이면 익숙한 이름으로)
function placeLabel(loc){
  if(!loc||loc.lat==null||!st.places)return loc?loc.name:'';
  for(const pl of st.places){
    const d=distKm(loc,pl);
    if(d!=null&&d*1000<=(pl.r||300))return pl.label;
  }
  return loc.name;
}

// countdown
function nextFixed(now){
  const ts=Object.keys(st.fixedTimes).filter(t=>st.fixedTimes[t]).sort();
  if(!ts.length)return null;const mins=t=>{const[h,m]=t.split(':').map(Number);return h*60+m};
  const nm=now.getHours()*60+now.getMinutes();
  for(const t of ts)if(mins(t)>nm){const d=new Date(now);const[h,m]=t.split(':').map(Number);d.setHours(h,m,0,0);return d}
  const d=new Date(now);d.setDate(d.getDate()+1);const[h,m]=ts[0].split(':').map(Number);d.setHours(h,m,0,0);return d;
}
function tick(){
  const now=new Date();
  const live=st.activeMoment&&now.getTime()<st.activeMoment.deadline;
  const ban=$('#banner');
  if(live){
    ban.classList.add('live');
    const s=Math.floor(Math.max(0,st.activeMoment.deadline-now.getTime())/1000);
    $('#bTag').textContent='지금 찍을 시간!';$('#bBig').textContent=pad(Math.floor(s/60))+':'+pad(s%60);
    $('#bSmall').textContent='마감까지 남은 시간 · 다 같이 찰칵!';
  }else{
    if(st.activeMoment)st.activeMoment=null;
    ban.classList.remove('live');
    $('#bTag').textContent='다음 모먼까지';$('#bSmall').textContent='곧 다 같이 찍어요 📸';
    if(st.mode==='fixed'){const nx=nextFixed(now);
      if(nx){const d=nx-now,h=Math.floor(d/3.6e6),m=Math.floor(d%3.6e6/6e4),s=Math.floor(d%6e4/1e3);
        $('#bBig').textContent=h>0?h+'시간 '+pad(m)+'분':pad(m)+':'+pad(s)}
      else $('#bBig').textContent='--:--';
    }else $('#bBig').textContent='깜짝 ⚡';
  }
}
setInterval(tick,1000);
$('#bCta').onclick=openCam;

// stories
function renderStories(){
  const posted=new Set(st.posts.map(p=>p.who));
  let h=`<div class="story you" onclick="${'document.getElementById(\'bCta\').click()'}"><div class="ring"><div class="face">＋</div></div><div class="nm">내 모먼</div></div>`;
  h+=st.members.map(m=>{
    const done=posted.has(m.id);
    const p=st.posts.find(x=>x.who===m.id);
    return `<div class="story ${done?'done':'waiting'}"><div class="ring"><div class="face" style="background:${done?SCENES[p.scene]:m.color}">${done?p.self:m.name[0]}</div></div><div class="nm">${m.name}</div></div>`;
  }).join('');
  var sEl=$('#stories');if(sEl)sEl.innerHTML=h;
}

// grid (한눈에 보기) — 인원수에 맞춰 자동 n분할
function renderGrid(){
  const g=$('#grid');
  const n=st.members.length;
  g.className='grid n'+Math.min(n,6);
  const latest={};st.posts.forEach(p=>{if(!latest[p.who])latest[p.who]=p});
  g.innerHTML=st.members.map(m=>{
    const p=latest[m.id];
    if(!p)return `<div class="gcell wait"><span>📷</span><div class="gname"><span class="nb">${m.name}</span></div></div>`;
    return `<div class="gcell" style="background:${SCENES[p.scene]||'#333'}" onclick="document.querySelectorAll('.vtoggle button')[2].click()">
      <span>${p.scene}</span>
      <div class="gpip" style="background:${mColor(m.id)}55">${p.self}</div>
      ${p.late?'<div class="glate">⏰</div>':'<div class="gtime">'+hhmm(p.at)+'</div>'}
      <div class="gname"><span class="nb">📍 ${placeLabel(p.loc)}${m.id!=='me'?' · '+distLabel(p.loc):''} · ${m.name}</span></div>
    </div>`;
  }).join('');
}

// feed
function renderFeed(){
  const f=$('#feed');
  if(!st.posts.length){f.innerHTML='<div class="empty"><span class="big">🌅</span>아직 오늘의 모먼이 없어요.<br>알림이 오면 다 같이 찍어요.</div>';return}
  f.innerHTML=st.posts.map(p=>`
    <div class="post">
      <div class="head">
        <div class="av" style="background:${mColor(p.who)}">${mName(p.who)[0]}</div>
        <div><div class="nm">${mName(p.who)}</div><div class="sub">${placeLabel(p.loc)}${p.who!=='me'?' · '+distLabel(p.loc):''}</div></div>
        ${p.late?'<span class="late">⏰ 늦게 올림</span>':'<span class="when">'+ago(p.at)+'</span>'}
      </div>
      <div class="photo" data-pid="${p.id}">
        <div class="main" style="background:${SCENES[p.scene]||'#333'}">${p.imgBack?`<img src="${p.imgBack}" alt="">`:p.scene}</div>
        <div class="pip" style="background:${mColor(p.who)}33" onclick="swapPip(this,event)">${p.imgFront?`<img src="${p.imgFront}" alt="">`:p.self}</div>
        <div class="locpin"><span class="ic">📍</span>${placeLabel(p.loc)}${p.who!=='me'?' · '+distLabel(p.loc):''}</div>
        <div class="timepin">${hhmm(p.at)}</div>
      </div>
      <div class="foot">
        <button class="react">❤️</button>
        <button class="react">🔥</button>
        <button class="react">😆</button>
        <button class="mapbtn" onclick="document.querySelectorAll('.vtoggle button')[0].click()">📍 지도에서 보기</button>
      </div>
    </div>`).join('');
}

// map (메인) — 지도 위 사진 핀
function renderMap(){
  const box=$('#mapbox');box.querySelectorAll('.mpin').forEach(e=>e.remove());
  const seen={};st.posts.forEach(p=>{if(!seen[p.who])seen[p.who]=p});
  st.members.forEach((m,i)=>{
    const p=seen[m.id];if(!p)return;
    const el=document.createElement('div');el.className='mpin'+(p.late?' late':'');
    el.style.left=(p.loc.x||20+i*20)+'%';el.style.top=(p.loc.y||40)+'%';
    const face=p.imgBack?`<img src="${p.imgBack}" alt="">`:p.scene;
    const dist=m.id!=='me'?` · <span class="d">${distLabel(p.loc)}</span>`:'';
    el.innerHTML=`<div class="ph" style="background:${SCENES[p.scene]}">${face}</div><div class="nm">${m.name}${dist}</div>`;
    el.onclick=()=>openPin(p,m);
    box.appendChild(el);
  });
  renderSummary(seen);
  $('#maplist').innerHTML=st.members.map(m=>{
    const p=seen[m.id];
    return `<div class="li" ${p?`onclick='__pin("${p.id}")'`:''} style="cursor:${p?'pointer':'default'}">
      <div class="av" style="background:${m.color}">${m.name[0]}</div>
      <div><div class="nm">${m.name}${m.id!=='me'&&p?' <span style="color:var(--teal);font-size:12px;font-weight:600">'+distLabel(p.loc)+'</span>':''}</div><div class="lc">${p?'📍 '+placeLabel(p.loc):'아직 위치 없음'}</div></div>
      ${p?'<div class="tm">'+ago(p.at)+'</div>':''}</div>`;
  }).join('');
}
window.__pin=(pid)=>{const p=st.posts.find(x=>x.id===pid);if(p)openPin(p,st.members.find(m=>m.id===p.who))};
$('#pinX').onclick=()=>$('#pinpop').classList.remove('on');
$('#pinpop').onclick=e=>{if(e.target.id==='pinpop')$('#pinpop').classList.remove('on')};

// 모먼 순간 가족이 얼마나 모였나/흩어졌나 요약
function renderSummary(seen){
  const el=$('#mapSummary');if(!el)return;
  const others=st.members.filter(m=>m.id!=='me'&&seen[m.id]);
  const posted=Object.keys(seen).length,total=st.members.length;
  let far=null,farD=-1;
  others.forEach(m=>{const d=distKm(st.myPos,seen[m.id].loc);if(d!=null&&d>farD){farD=d;far=m}});
  const avg=others.length?others.reduce((s,m)=>s+(distKm(st.myPos,seen[m.id].loc)||0),0)/others.length:0;
  const allHere=others.length&&others.every(m=>(distKm(st.myPos,seen[m.id].loc)||9)<0.3);
  el.innerHTML=
    `<span class="chip"><span class="k">참여</span><b>${posted}/${total}</b></span><span class="sep"></span>`+
    (allHere
      ? `<span class="chip">✨ <b>모두 같은 곳에!</b></span>`
      : `<span class="chip"><span class="k">평균 거리</span><b>${avg<1?Math.round(avg*1000)+'m':avg.toFixed(1)+'km'}</b></span>`+
        (far?`<span class="sep"></span><span class="chip"><span class="k">가장 먼</span><b>${far.name} ${farD<1?Math.round(farD*1000)+'m':farD.toFixed(1)+'km'}</b></span>`:''));
}

// 핀 탭 → 그 순간 사진 팝업
function openPin(p,m){
  const main=p.imgBack?`<img src="${p.imgBack}" alt="">`:p.scene;
  const pip=p.imgFront?`<img src="${p.imgFront}" alt="">`:p.self;
  $('#pinPh').style.background=SCENES[p.scene]||'#222';
  $('#pinPh').innerHTML=`<div class="pmain" style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-size:120px;background:${SCENES[p.scene]||'#222'}">${main}</div>
    <div class="pip" onclick="swapPin(this,event)" style="background:${m.color}33">${pip}</div>
    <div class="tt">${hhmm(p.at)}${p.late?' · ⏰ 늦음':''}</div>`;
  $('#pinAv').style.background=m.color;$('#pinAv').textContent=m.name[0];
  $('#pinNm').textContent=m.name;
  $('#pinLc').textContent='📍 '+placeLabel(p.loc)+(m.id!=='me'?' · '+distLabel(p.loc)+' 떨어짐':'');
  $('#pinpop').classList.add('on');
}
function swapPin(pipEl,ev){
  ev.stopPropagation();
  const ph=pipEl.closest('.ph');const main=ph.querySelector('.pmain');
  const mH=main.innerHTML,mBg=main.style.background;
  const pH=pipEl.innerHTML,pBg=pipEl.style.background;
  main.innerHTML=pH;main.style.background=pBg;
  pipEl.innerHTML=mH;pipEl.style.background=mBg;
}

// capture
let snapped=false,curLoc=null,curScene='🌆',curSelf='🙂';
let streams={back:null,front:null},shots={back:null,front:null},camMode='none';

function stopStreams(){
  ['back','front'].forEach(k=>{if(streams[k]){streams[k].getTracks().forEach(t=>t.stop());streams[k]=null}});
}
async function startCameras(){
  const hint=$('#camHint'),vBack=$('#vBack'),vFront=$('#vFront');
  shots={back:null,front:null};
  // 폴백 비주얼(이모지) 준비
  $('#camMain').textContent=curScene;
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){
    return useEmojiFallback('이 브라우저는 카메라를 지원하지 않아 데모 이미지로 보여드려요');
  }
  hint.style.display='';hint.textContent='카메라 권한을 확인하는 중…';
  // 1) 진짜 동시 시도: 뒤·앞 스트림 둘 다 요청
  try{
    const back=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}},audio:false});
    streams.back=back;vBack.srcObject=back;vBack.style.display='';
    try{
      const front=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user'},audio:false});
      streams.front=front;vFront.srcObject=front;vFront.style.display='';
      camMode='dual';hint.style.display='none';
      $('#snapQ').textContent='앞·뒤 동시 촬영 준비 완료 · 버튼을 눌러요';
      $('#camMain').style.display='none';$('#camPip').style.display='none';
      return;
    }catch(e){
      // 동시 실패 → 연속 모드 (뒤 먼저, 셔터 후 앞으로 전환)
      camMode='sequential';hint.style.display='none';
      $('#vFront').style.display='none';$('#camPip').style.display='none';
      $('#snapQ').textContent='뒤 카메라 → 버튼 누르면 앞 카메라로 (연속)';
      $('#camMain').style.display='none';
      return;
    }
  }catch(e){
    return useEmojiFallback('카메라를 열 수 없어 데모 이미지로 보여드려요');
  }
}
function useEmojiFallback(msg){
  camMode='emoji';
  $('#vBack').style.display='none';$('#vFront').style.display='none';
  $('#camMain').style.display='';$('#camMain').textContent=curScene;
  $('#camView').style.background=SCENES[curScene];
  $('#camPip').style.display='';$('#camPip').textContent=curSelf;$('#camPip').style.background=mColor('me')+'55';
  $('#camHint').style.display='none';
  $('#snapQ').textContent=msg;
}
function grab(video){
  try{
    const c=document.createElement('canvas');
    c.width=video.videoWidth||720;c.height=video.videoHeight||960;
    const ctx=c.getContext('2d');ctx.drawImage(video,0,0,c.width,c.height);
    return c.toDataURL('image/jpeg',.85);
  }catch(e){return null}
}

function openCam(){
  snapped=false;
  const scenes=Object.keys(SCENES);curScene=scenes[Math.floor(Math.random()*scenes.length)];
  curSelf=SELF[Math.floor(Math.random()*SELF.length)];
  $('#camView').style.background='linear-gradient(135deg,#2a2030,#16161a)';
  $('#camLive').style.display='';$('#snapBar').style.display='';$('#actBar').style.display='none';
  $('#camLoc').textContent='📍 위치 확인 중…';
  $('#modal').classList.add('on');
  getLoc();startCameras();
}
function getLoc(){
  const places=['남산 근처','한강공원','회사 앞','동네 카페','우리집','전통시장','계곡','시립도서관'];
  const fallback=()=>{const n=places[Math.floor(Math.random()*places.length)];
    curLoc={name:n,x:18+Math.random()*64,y:18+Math.random()*60};$('#camLoc').textContent='📍 '+n};
  if(navigator.geolocation){
    navigator.geolocation.getCurrentPosition(
      p=>{curLoc={name:'현재 위치',x:40+Math.random()*20,y:40+Math.random()*20,lat:p.coords.latitude,lng:p.coords.longitude};$('#camLoc').textContent='📍 현재 위치';},
      fallback,{timeout:3000});
  }else fallback();
}

$('#snapBtn').onclick=async()=>{
  if(camMode==='dual'){
    shots.back=grab($('#vBack'));shots.front=grab($('#vFront'));
    finishSnap();
  }else if(camMode==='sequential'){
    // 뒤 캡처 → 앞 카메라로 전환 → 잠깐 뒤 자동 캡처
    shots.back=grab($('#vBack'));
    toast('뒤 찰칵! 앞 카메라로…');
    if(streams.back){streams.back.getTracks().forEach(t=>t.stop());streams.back=null}
    try{
      const front=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user'},audio:false});
      streams.front=front;const vf=$('#vFront');vf.srcObject=front;vf.style.display='';
      $('#camPip').style.display='none';
      await new Promise(r=>setTimeout(r,700)); // 미리보기 잠깐
      shots.front=grab(vf);
    }catch(e){shots.front=null}
    finishSnap();
  }else{ // emoji
    finishSnap();
  }
};
function finishSnap(){
  snapped=true;
  $('#camLive').style.display='none';$('#snapBar').style.display='none';$('#actBar').style.display='flex';
  toast('찰칵! 📸');
}
$('#retakeBtn').onclick=()=>{stopStreams();openCam()};
$('#postBtn').onclick=()=>{
  const now=Date.now();const late=st.activeMoment?now>st.activeMoment.deadline:true;
  const myLoc=curLoc||{name:'어딘가',x:50,y:50};
  myLoc.self=true;
  if(myLoc.lat!=null)st.myPos={lat:myLoc.lat,lng:myLoc.lng};
  st.posts.unshift({id:'p'+now,who:'me',scene:curScene,self:curSelf,
    imgBack:shots.back||null,imgFront:shots.front||null,
    loc:myLoc,at:now,late});
  stopStreams();
  try{save()}catch(e){/* 이미지로 용량 초과시 무시 */}
  renderFeed();renderGrid();renderStories();
  $('#modal').classList.remove('on');
  toast(late?'늦었지만 올렸어요 ⏰':'모먼 공유 완료! ✨');
};
$('#modal').onclick=e=>{if(e.target.id==='modal'){stopStreams();$('#modal').classList.remove('on')}};

// moment trigger
$('#demoBtn').onclick=()=>{
  st.activeMoment={at:Date.now(),deadline:Date.now()+st.window*60*1000};save();
  $$('.nav button').forEach(x=>x.classList.remove('on'));$$('.nav button')[0].classList.add('on');
  $$('.view').forEach(v=>v.classList.remove('on'));$('#v-home').classList.add('on');
  toast('📸 모먼 시작! 지금 찍어요');tick();window.scrollTo({top:0,behavior:'smooth'});
};

// settings
function renderMode(){
  $$('#modePills .pill').forEach(p=>p.classList.toggle('on',p.dataset.mode===st.mode));
  $('#fixedRow').style.display=st.mode==='fixed'?'':'none';
  $('#randomRow').style.display=st.mode==='random'?'':'none';
}
$$('#modePills .pill').forEach(p=>p.onclick=()=>{st.mode=p.dataset.mode;save();renderMode();tick()});
function renderTimes(){
  const g=$('#fixedTimes');
  g.innerHTML=Object.keys(st.fixedTimes).map(t=>`<button class="pill ${st.fixedTimes[t]?'on':''}" data-t="${t}">${t}</button>`).join('')+`<button class="pill" data-add="1">＋</button>`;
  g.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{st.fixedTimes[b.dataset.t]=!st.fixedTimes[b.dataset.t];save();renderTimes();tick()});
  g.querySelector('[data-add]').onclick=()=>{const t=prompt('시간 입력 (예: 18:30)','18:30');if(t&&/^\d{1,2}:\d{2}$/.test(t)){st.fixedTimes[t]=true;save();renderTimes();tick()}};
}
$$('#windowPills .pill').forEach(p=>p.onclick=()=>{st.window=+p.dataset.w;$$('#windowPills .pill').forEach(x=>x.classList.toggle('on',x===p));save()});
function renderMembers(){$('#memberList').innerHTML=st.members.map(m=>`<div class="mem"><div class="av" style="background:${m.color}">${m.name[0]}</div><div style="flex:1;font-weight:600">${m.name}</div>${m.id==='me'?'<span style="font-size:11px;color:var(--muted);font-weight:600">나</span>':''}</div>`).join('')}
$('#inviteBtn').onclick=()=>{navigator.clipboard?.writeText('MP-4F2K');toast('초대 코드 복사됨 · MP-4F2K')};

function topAv(){$('#topAv').innerHTML=st.members.slice(0,3).map(m=>`<span style="background:${m.color}">${m.name[0]}</span>`).join('')}
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');setTimeout(()=>t.classList.remove('on'),2200)}

// 피드 카드: 큰 사진 ↔ 작은 PIP 자리 바꾸기
function swapPip(pipEl,ev){
  ev.stopPropagation();
  const photo=pipEl.closest('.photo');const main=photo.querySelector('.main');
  const mH=main.innerHTML,mBg=main.style.background;
  const pH=pipEl.innerHTML,pBg=pipEl.style.background;
  main.innerHTML=pH;main.style.background=pBg||'#333';
  pipEl.innerHTML=mH;pipEl.style.background=mBg||'#333';
}

// grid/feed toggle
// 지도/한눈에/피드 토글
$$('#vtoggle button').forEach(b=>b.onclick=()=>{
  $$('#vtoggle button').forEach(x=>x.classList.remove('on'));b.classList.add('on');
  const v=b.dataset.v;
  $('#paneMap').style.display=v==='map'?'block':'none';
  $('#grid').style.display=v==='grid'?'grid':'none';
  $('#feed').style.display=v==='feed'?'flex':'none';
  if(v==='map')renderMap();
});

// init
$('#grpName').textContent=st.grpName;
topAv();renderMode();renderTimes();renderMembers();renderStories();renderFeed();renderGrid();renderMap();tick();
</script>
</body>
</html>
