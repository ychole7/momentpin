<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>모먼핀 · 지도 위에 안부를 묻다</title>

    <!-- 카톡/SNS 공유 미리보기 (Open Graph) -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="모먼핀 — 지도 위에 안부를 묻다" />
    <meta property="og:description" content="멀리 있어도, 오늘 서로의 순간을 나눠요. 지도 위에서 안부를 묻는 우리만의 공간 📍" />
    <meta property="og:image" content="https://momentpin.vercel.app/og-image.png" />
    <meta property="og:url" content="https://momentpin.vercel.app" />
    <meta property="og:site_name" content="모먼핀" />
    <meta property="og:locale" content="ko_KR" />
    <!-- 트위터 카드 -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="모먼핀 — 지도 위에 안부를 묻다" />
    <meta name="twitter:description" content="멀리 있어도, 오늘 서로의 순간을 나눠요. 지도 위에서 안부를 묻는 우리만의 공간 📍" />
    <meta name="twitter:image" content="https://momentpin.vercel.app/og-image.png" />
    <meta name="description" content="멀리 있어도, 오늘 서로의 순간을 나눠요. 지도 위에서 안부를 묻는 우리만의 공간, 모먼핀." />

    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#fafafa" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#161719" media="(prefers-color-scheme: dark)" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="모먼핀" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
      :root {
        --mp-bg: #fafafa; --mp-card: #ffffff; --mp-card2: #f4f4f6;
        --mp-ink: #16161a; --mp-sub: #5b5b63; --mp-muted: #9b9ba3;
        --mp-line: #efeff2; --mp-line2: #e0e0e6;
        --mp-coral: #ff4d5e; --mp-coral2: #ff7a45;
        --mp-skel1: #ececed; --mp-skel2: #f5f5f6;
        --mp-topbar: rgba(250,250,250,.92);
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --mp-bg: #161719; --mp-card: #222428; --mp-card2: #2c2e33;
          --mp-ink: #f0f0f2; --mp-sub: #b8b8c0; --mp-muted: #8a8a92;
          --mp-line: #303236; --mp-line2: #3a3c41;
          --mp-coral: #ff5d6c; --mp-coral2: #ff8a5c;
          --mp-skel1: #2c2e33; --mp-skel2: #363840;
          --mp-topbar: rgba(22,23,25,.92);
        }
      }
      body { background: var(--mp-bg); }
      /* 페이지 전체 핀치줌/더블탭줌 차단 (네이티브 앱 느낌) */
      html, body { touch-action: pan-x pan-y; -webkit-text-size-adjust: 100%; overscroll-behavior: none; }
      /* 단, 지도와 사진은 자체 줌을 쓰도록 예외 */
      .leaflet-container, .zoomable { touch-action: auto !important; }
      @keyframes heartPop{0%{transform:scale(1)}35%{transform:scale(1.5)}60%{transform:scale(.9)}100%{transform:scale(1)}}
      .heart-pop{animation:heartPop .42s ease-out}
      @keyframes confettiFall{0%{transform:translateY(-10px) rotate(0);opacity:1}100%{transform:translateY(110vh) rotate(720deg);opacity:0}}
      .confetti-piece{position:fixed;top:-10px;width:10px;height:14px;z-index:9999;pointer-events:none;animation:confettiFall linear forwards}
      @keyframes popIn{0%{transform:scale(.6);opacity:0}60%{transform:scale(1.05)}100%{transform:scale(1);opacity:1}}
      .pop-in{animation:popIn .35s ease-out}
      @keyframes shimmer{0%{background-position:-400px 0}100%{background-position:400px 0}}
      .skel{background:var(--mp-skel1);background-image:linear-gradient(90deg,var(--mp-skel1) 0px,var(--mp-skel2) 200px,var(--mp-skel1) 400px);background-size:800px 100%;animation:shimmer 1.3s infinite linear;border-radius:10px}
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
